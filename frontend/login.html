<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Clínica</title>
    <link rel="stylesheet" href="/frontend/css/stylePrincipal.css">
    <!-- 2. Estilos específicos de la tarjeta de login -->
    <link rel="stylesheet" href="css/LoginStyle.css">
</head>
<body>
    <header>
        <h1>Clínica - Reserva tu turno</h1>
        <nav><a href="index.html">Volver al inicio</a></nav>
    </header>

    <main>
        <div class="contenedor-login">
            <h2 style="font-size: 1.8rem; margin-bottom: 1rem;">Iniciar Sesión</h2>
            <p id="mensaje-error" class="error-msj"></p>
            
            <form id="form-login">
                <div class="form-grupo">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Ingresar</button>
            </form>
        </div>
    </main>
    
    <script src="js/login.js"></script>
</body>
</html>
